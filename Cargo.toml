[workspace]
resolver = "3"
members = ["keysets", "pickmap-core", "pickmap-gen", "pickmap-macros", "pickmap", "bench"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dahankzter/pickmap"

[profile.release]
codegen-units = 1
lto = "fat"
debug = 1
