[package]
name = "pickmap-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal to pickmap: parses static_map! input, searches for a perfect hash and emits the lookup."
documentation = "https://docs.rs/pickmap"
keywords = ["perfect-hash"]
categories = ["development-tools::procedural-macro-helpers"]

[dependencies]
pickmap-core = { path = "../pickmap-core", version = "=0.3.0" }
proc-macro2 = "1"
quote = "1"
litrs = { version = "1", features = ["proc-macro2"] }

[dev-dependencies]
keysets = { path = "../keysets" }
