[package]
name = "pickmap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast, immutable string maps built at compile time: static_map! generates a perfect-hash lookup for each key set that never mispredicts on near-misses."
documentation = "https://docs.rs/pickmap"
readme = "../README.md"
keywords = ["perfect-hash", "static", "map", "phf", "lookup"]
categories = ["data-structures", "no-std", "no-std::no-alloc", "algorithms"]

[dependencies]
pickmap-core = { path = "../pickmap-core", version = "=0.3.0" }
pickmap-macros = { path = "../pickmap-macros", version = "=0.3.0" }

[dev-dependencies]
trybuild = "1"
